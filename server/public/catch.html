<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>__OG_TITLE__</title>

  <!-- Open Graph preview card -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="__OG_TITLE__">
  <meta property="og:description" content="__OG_DESC__">
  <meta property="og:image" content="/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="__OG_TITLE__">
  <meta name="twitter:description" content="__OG_DESC__">
  <meta name="twitter:image" content="/icon-512.png">

  <meta name="theme-color" content="#4a8c3f">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Press Start 2P', monospace;
      background: #87ceeb;
      min-height: 100vh;
      overflow: hidden;
      color: #5c3d2e;
    }
    .wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .hills { position: fixed; bottom: 0; left: 0; right: 0; height: 40vh; }
    .hill { position: absolute; bottom: 0; width: 100%; border-radius: 50% 50% 0 0; }
    .hill-1 { height: 35vh; background: #7bc96f; }
    .hill-2 { height: 28vh; background: #4a8c3f; left: -10%; width: 60%; }
    .hill-3 { height: 25vh; background: #4a8c3f; right: -10%; width: 60%; }
    .hill-4 { height: 18vh; background: #2d5a1e; }
    .title {
      font-size: 20px; color: white; text-shadow: 3px 3px 0 #5c3d2e;
      letter-spacing: 3px; margin-top: 24px;
    }
    .sub {
      font-size: 10px; color: #2d5a1e; text-shadow: 1px 1px 0 #fff;
      margin-top: 14px; line-height: 1.6;
    }
    .from { color: #c9a84c; font-size: 12px; }
    canvas { image-rendering: pixelated; }
    @keyframes fall {
      0% { transform: translateY(-120vh) scale(0.3) rotate(-360deg); }
      70% { transform: translateY(10px) scale(1.1) rotate(0deg); }
      85% { transform: translateY(-8px) scale(0.95); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }
    .potato-drop { animation: fall 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  </style>
</head>
<body>
  <div class="hills">
    <div class="hill hill-1"></div>
    <div class="hill hill-2"></div>
    <div class="hill hill-3"></div>
    <div class="hill hill-4"></div>
  </div>

  <div class="wrap">
    <canvas id="spud" width="120" height="120" class="potato-drop"></canvas>
    <div class="title">INCOMING!</div>
    <div class="sub">
      <span class="from">__FROM_NAME__</span> tossed ye a hot potato!<br>
      Opening the farm...
    </div>
  </div>

  <script>
    // Draw pixel potato
    (function() {
      const DATA = [
        [0,4,1,1,1,4,0,0],[5,1,5,5,5,1,5,0],[1,5,6,6,5,5,1,0],[1,5,6,6,6,5,1,0],
        [1,5,5,6,6,5,1,0],[0,1,5,5,5,5,1,0],[4,0,1,1,1,1,0,4],[0,0,4,1,1,4,0,0],
      ];
      const PAL = { 1: '#5c3d2e', 4: '#ff4444', 5: '#ff8c42', 6: '#ffd700' };
      const c = document.getElementById('spud');
      const ctx = c.getContext('2d');
      const px = c.width / 8;
      DATA.forEach((row, y) => row.forEach((v, x) => {
        if (PAL[v]) { ctx.fillStyle = PAL[v]; ctx.fillRect(x * px, y * px, px, px); }
      }));
    })();

    // Auto-redirect to the game with toss id preserved.
    // The preview pages briefly (so the animation kicks off a feel),
    // then jumps into the app which continues the drop-in animation.
    const tossId = window.location.pathname.split('/catch/')[1] || '';
    setTimeout(() => {
      window.location.replace('/?toss=' + encodeURIComponent(tossId));
    }, 700);
  </script>
</body>
</html>
